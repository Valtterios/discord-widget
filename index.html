<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LahtiAG on Discord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{font:12px/1.5 Lato,Helvetica,Arial,sans-serif;color:#2e3338;background:transparent}
  .pg{height:100%;display:flex;flex-direction:column;gap:14px}
  .intro{color:#5c5e66;font-size:12px;line-height:1.55;max-width:72ch;flex:0 0 auto}
  .w{flex:1 1 auto;width:100%;min-height:0;display:flex;flex-direction:column;position:relative;
     background:#fff;border:1px solid #e3e5e8;border-radius:10px;overflow:hidden}
  .hd{display:flex;align-items:center;gap:12px;padding:14px 16px;flex:0 0 auto;
      border-bottom:1px solid #e3e5e8}
  .lg{width:44px;height:44px;border-radius:12px;flex:0 0 auto;background:#5865f2;overflow:hidden}
  .lg img{width:100%;height:100%;object-fit:cover;display:block}
  .mt{flex:1 1 auto;min-width:0}
  .nm{font-weight:700;font-size:14px;color:#060607;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .on{font-size:12px;color:#5c5e66;margin-top:1px}
  .on b{color:#23a55a;font-weight:400}
  .bt{flex:0 0 auto;padding:9px 18px;background:#5865f2;color:#fff;text-decoration:none;
      border-radius:6px;font-size:12px;font-weight:700;white-space:nowrap;transition:background .12s}
  .bt:hover{background:#4752c4}
  .ws{flex:1 1 0;min-height:0;overflow-y:auto;padding:14px 16px;display:grid;gap:10px;align-content:start;
      grid-template-columns:repeat(auto-fill,minmax(38px,1fr))}
  .av{position:relative;height:38px;cursor:default}
  .av img{width:38px;height:38px;border-radius:50%;display:block;background:#e3e5e8}
  .av:hover img{outline:2px solid #5865f2;outline-offset:1px}
  .dt{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;box-sizing:border-box;
      border-radius:50%;border:2px solid #fff;background:#80848e}
  .online{background:#23a55a}.idle{background:#f0b232}.dnd{background:#f23f43}
  .tip{position:absolute;z-index:9;left:0;top:0;pointer-events:none;opacity:0;
       transition:opacity .1s;background:#111214;color:#f2f3f5;font-size:11px;font-weight:700;
       padding:6px 9px;border-radius:5px;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.22)}
  .tip small{display:block;font-weight:400;color:#b5bac1;font-size:10px;margin-top:1px}
  .ws::-webkit-scrollbar{width:8px}
  .ws::-webkit-scrollbar-thumb{background:#dcdde0;border-radius:4px}
  .ws::-webkit-scrollbar-track{background:transparent}
  @media (max-width:420px){
    .hd{padding:10px 12px;gap:10px}
    .lg{width:36px;height:36px;border-radius:10px}
    .nm{font-size:13px}
    .on{font-size:11px}
    .bt{padding:7px 12px;font-size:11px}
    .ws{padding:10px 12px;gap:8px}
  }
  @media (max-height:170px){
    .hd{border-bottom:0}
    .ws{display:none}
  }
</style>
</head>
<body>
<div class="pg">
  <p class="intro">Our Discord server is the central hub for all our communications and
  community interactions. It's where we announce upcoming events, share updates, and keep
  everyone informed about what's happening in our association.</p>

  <div class="w">
  <div class="hd">
    <div class="lg" id="lg"></div>
    <div class="mt">
      <div class="nm" id="nm">Loading…</div>
      <div class="on" id="on"></div>
    </div>
    <a class="bt" id="bt" target="_blank" rel="noopener" hidden>Join Server</a>
  </div>
  <div class="ws" id="ws"></div>
  <div class="tip" id="tip"></div>
  </div>
</div>

<script>
const GUILD = "1210598510999633971";
const $ = (id) => document.getElementById(id);
const card = document.querySelector(".w");
const tip = $("tip");

const setCounts = (online, total) => {
  $("on").innerHTML = "";
  const dot = document.createElement("b");
  dot.textContent = "●";
  $("on").append(dot, ` ${online} online${total ? ` · ${total} members` : ""}`);
};

const json = (url) => fetch(url).then((r) => {
  if (!r.ok) throw new Error(`${url} -> ${r.status}`);
  return r.json();
});

json(`https://discord.com/api/guilds/${GUILD}/widget.json`)
  .then(async (d) => {
    $("nm").textContent = d.name;
    document.title = `${d.name} on Discord`;
    setCounts(d.presence_count);

    if (d.instant_invite) {
      $("bt").href = d.instant_invite;
      $("bt").hidden = false;
    }

    // Members are online-only and capped at 100 by Discord.
    for (const m of d.members || []) {
      const a = document.createElement("div");
      a.className = "av";
      a.dataset.name = m.username;
      if (m.game) a.dataset.game = m.game.name;

      const img = document.createElement("img");
      img.src = m.avatar_url;   // signed, single-use CDN url — never cache it
      img.alt = "";
      img.loading = "lazy";

      const dot = document.createElement("div");
      dot.className = `dt ${m.status || ""}`;

      a.append(img, dot);
      $("ws").append(a);
    }

    if (!d.instant_invite) return;

    // The widget endpoint omits the server icon and the total member count;
    // the invite endpoint carries both and allows CORS. The invite code expires,
    // so it is re-read from widget.json each load rather than hardcoded.
    const code = d.instant_invite.split("/").pop();
    const v = await json(`https://discord.com/api/v9/invites/${code}?with_counts=true`);

    const total = v.approximate_member_count ?? v.profile?.member_count;
    if (total) setCounts(d.presence_count, total);

    const hash = v.guild?.icon;
    if (!hash) return;
    const img = document.createElement("img");
    img.src = `https://cdn.discordapp.com/icons/${GUILD}/${hash}` +
              `${hash.startsWith("a_") ? ".gif" : ".png"}?size=128`;
    img.alt = "";
    $("lg").replaceChildren(img);
  })
  .catch((err) => {
    console.error(err);
    $("nm").textContent = "Couldn't load widget";
  });

card.addEventListener("mouseover", (e) => {
  const a = e.target.closest(".av");
  if (!a) return;
  tip.replaceChildren(a.dataset.name);
  if (a.dataset.game) {
    const g = document.createElement("small");
    g.textContent = `Playing ${a.dataset.game}`;
    tip.append(g);
  }
  tip.style.opacity = "1";
  const r = a.getBoundingClientRect(), c = card.getBoundingClientRect();
  const x = r.left - c.left + r.width / 2 - tip.offsetWidth / 2;
  tip.style.left = `${Math.max(4, Math.min(x, c.width - tip.offsetWidth - 4))}px`;
  const above = r.top - c.top - tip.offsetHeight - 8;
  tip.style.top = `${above < 0 ? r.bottom - c.top + 8 : above}px`;
});

card.addEventListener("mouseout", (e) => {
  if (e.target.closest(".av")) tip.style.opacity = "0";
});
</script>
</body>
</html>
